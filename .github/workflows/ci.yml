name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm arch
      - run: pnpm test:unit

  integration:
    name: Integration tests and evaluations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge
          POSTGRES_DB: agentforge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentforge" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://agentforge:agentforge@localhost:5432/agentforge
      TEST_DATABASE_URL: postgres://agentforge:agentforge@localhost:5432/agentforge_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the test database
        run: PGPASSWORD=agentforge psql -h localhost -U agentforge -d agentforge -c "CREATE DATABASE agentforge_test"
      - run: pnpm test:int
      - name: Migrate and seed the demo workspace
        run: pnpm db:migrate && pnpm db:seed
      - name: Regression evaluations (deterministic demo model)
        run: pnpm evals --min-pass-rate 1 --fail-on-regression
      - name: Build the web app and the server
        run: pnpm --filter @agentforge/web build && pnpm --filter @agentforge/server build
      - name: Start the all-in-one server
        run: |
          SERVE_WEB=true WEB_DIR=../web NODE_ENV=production PORT=4000 APP_URL=http://localhost:4000 \
            nohup node apps/server/dist/all-in-one.js > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4000/health/ready && break; sleep 2; done
        env:
          MIGRATIONS_DIR: apps/server/dist/migrations
      - name: End-to-end tests (Playwright + axe)
        run: |
          pnpm --filter @agentforge/web exec playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:4000 pnpm e2e
      - name: Server log
        if: failure()
        run: cat server.log || true

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agentforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
