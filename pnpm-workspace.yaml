packages:
  - apps/*
  - packages/*

# pnpm blocks dependency install scripts unless they are allowed here.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  cpu-features: false
  protobufjs: false
  ssh2: false

# pnpm holds back very new releases by default (supply-chain safety).
# These were current when the project was generated and are explicitly accepted.
minimumReleaseAgeExclude:
  - '@scalar/client-side-rendering@0.4.5'
  - '@scalar/fastify-api-reference@1.72.1'
  - '@scalar/helpers@0.15.0'
  - '@scalar/json-magic@0.15.2'
  - '@scalar/json-schema-validator@0.1.6'
  - '@scalar/openapi-parser@0.29.7'
  - '@scalar/openapi-upgrader@0.4.0'
  - '@scalar/openapi-validator@0.1.6'
  - '@scalar/schemas@0.12.1'
  - '@scalar/types@0.22.1'
  - '@tanstack/query-core@5.104.0'
  - '@tanstack/react-query@5.104.0'
  - '@types/node@24.19.0'
  - bullmq@6.3.9
  - react-hook-form@7.89.0
